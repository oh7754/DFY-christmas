<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>크리스마스 트리 갤러리</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/style.css" />

    <!-- 기본 -->
    <meta property="og:title" content="크리스마스 트리 갤러리" />
    <meta property="og:description" content="한 줄 소원이 오너먼트처럼 트리에 쌓입니다. 링크를 눌러 확인해요 🎄" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oh7754.github.io/DFY-christmas/" />

    <!-- 썸네일 이미지 (절대경로/https 필수) -->
    <meta property="og:image" content="https://oh7754.github.io/DFY-christmas/source/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ✅ three / three/addons importmap -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- 상단 프로필 + 햄버거 버튼 -->
    <div id="topBar" class="top-bar">
      <div id="topAccount" class="top-account collapsed">
        <div class="top-account-avatar">
          <span id="topInitial">?</span>
          <img
            id="topImage"
            class="profile-image hidden"
            alt="프로필 이미지"
          />
        </div>
        <div class="top-account-text">
          <div id="topEmail" class="top-email">로그인 필요</div>
          <div id="topSub" class="top-sub">
            <span id="topStatus">사내 구글 계정만 사용 가능</span>
            <button id="logoutBtn" class="logout-link hidden" type="button">로그아웃</button>
          </div>
        </div>
      </div>

      <button id="menuToggle" class="menu-circle" aria-label="메뉴 열기">
        <div class="menu-icon">
          <span></span><span></span><span></span>
        </div>
        <div class="menu-close">✕</div>
      </button>
    </div>

    <!-- 햄버거 패널 -->
    <div id="sidePanel" class="side-panel">
      <div class="side-inner">
        <div class="panel-section">
          <div class="panel-section-header">
            <span class="panel-title">내가 올린 소원</span>
            <button id="openWishModal" class="btn primary small">
              + 소원 추가
            </button>
          </div>
          <div class="wish-list-wrap">
            <div id="myWishList" class="wish-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 트리 위에서 클릭했을 때 나오는 편지 패널 -->
    <!-- 트리 위에서 클릭했을 때 나오는 편지 보기 모달 -->
    <div id="wishPanel" class="wish-view-modal hidden">
      <div class="modal-backdrop"></div>

      <div class="wish-view-inner">
        <div class="wish-view-letter">
          <!-- 편지지 이미지 재사용 -->
          <img
            src="source/letter.png"
            alt="소원 편지"
            class="wish-view-letter-bg"
          />

          <!-- 닫기 버튼 (작성 UI랑 동일 스타일) -->
          <button
            id="wishCloseBtn"
            class="wish-close-circle"
            aria-label="편지 닫기"
          >
            ✕
          </button>

          <!-- 편지 위 컨텐츠 -->
          <div class="wish-view-letter-content">
            <!-- 이미지 프리뷰 (드롭존 위치와 유사) -->
            <div class="wish-view-transform" id="wishViewImageTransform">
              <div id="wishViewImage" class="wish-view-image"></div>
              <img src="source/polaroid.png" alt="" class="wish-image-frame" id="wishFrameOverlayView">
            </div>
            
           
        
            <!-- 이름 + 소원 내용 -->
            <div class="wish-view-text-area">
              <div class="wish-view-name" id="wishSender"></div>
              <div class="wish-view-body">
                <p id="wishContent"></p>
              </div>
            </div>
            <!-- 편지 본문 아래 쪽에 추가 -->
            <div class="wish-like-bar">
              <button id="wishLikeBtn" class="wish-like-btn" aria-label="좋아요">
                <svg class="like-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M16.7783 2.7761C17.5484 2.76941 18.3126 2.91614 19.0254 3.20774C19.7381 3.49935 20.3861 3.93079 20.9307 4.47532C21.475 5.01972 21.9057 5.66713 22.1973 6.37961C22.4889 7.09234 22.6356 7.85664 22.6289 8.62668C22.6222 9.39656 22.462 10.1575 22.1582 10.865C21.8565 11.5672 21.4182 12.2025 20.8701 12.7351L12.6768 20.9304C12.4892 21.1179 12.2349 21.2234 11.9697 21.2234C11.7046 21.2233 11.4502 21.1179 11.2627 20.9304L3.06934 12.7361C1.98216 11.6485 1.3712 10.1732 1.37109 8.63547C1.37115 7.09768 1.98216 5.62248 3.06934 4.53489C4.15694 3.44773 5.63213 2.83571 7.16992 2.83567C8.7077 2.83567 10.1829 3.44681 11.2705 4.53391L11.9697 5.23313L12.6699 4.53391C13.2024 3.98609 13.838 3.54837 14.54 3.2468C15.2475 2.94296 16.0084 2.78283 16.7783 2.7761Z" />
                </svg>
              </button>
              <span id="wishLikeCount" class="wish-like-count">0</span>
            </div>
          </div>
        </div>
      </div>
    </div>


    <!-- 소원 작성 모달 -->
<div id="wishModal" class="modal hidden">
  <div class="modal-backdrop"></div>

  <div class="wish-modal-inner">
    <div class="wish-letter">
      <!-- 편지지 이미지 -->
      <img
        src="source/letter.png"
        alt="편지지"
        class="wish-letter-bg"
      />

      <!-- ✕ 동그라미 닫기 버튼 -->
      <button
        id="wishCancelBtn"
        class="wish-close-circle"
        aria-label="소원 작성 닫기"
      >
        ✕
      </button>

      <!-- 편지지 위에 얹히는 컨텐츠 -->
      <div class="wish-letter-content">
        <!-- 이미지 드롭존 -->
         <div class="wish-view-transform" id="wishDropzoneTransform" >
          <div id="wishImageDropzone" class="wish-image-dropzone">
            <div class="wish-image-preview"></div>
            <div class="wish-image-placeholder">
              <p class="wish-image-title">소원 이미지를 올려주세요</p>
              <p class="wish-image-desc">
                이미지를 여기로 끌어놓거나<br />
                클릭해서 파일을 선택할 수 있어요.
              </p>
            </div>
          </div>
          <img src="source/polaroid.png" alt="" class="wish-image-frame" id="wishFrameOverlayWrite" />
          <button id="polaroidFrameBtn" class="polaroid-frame-btn"> </button>
        </div>
        
        <!-- 텍스트 입력 영역 -->
        <div class="wish-text-area">
          <div class="wish-name-row">
            <!-- 가운데 정렬용: 이름 + '비밀 소원' 라벨 -->
            <div class="wish-name-center">
              <div class="wish-name-field">
                <!-- 이름 인풋 -->
                <input
                  id="wishNameInput"
                  class="wish-input-name"
                  type="text"
                  placeholder="이름을 적어주세요"
                />
                <!-- 익명일 때만 보이는 라벨 -->
                <span class="wish-secret-label">비밀 소원</span>
              </div>
            </div>
          </div>

          <textarea
            id="wishTextInput"
            class="wish-input-text"
            rows="5"
            placeholder="여기에 소원을 적어주세요."
          ></textarea>
          <!-- 버튼 영역: 이제는 '소원 올리기'만 남김 -->
          <div class="wish-actions">
            <!-- 오른쪽 토글 버튼 -->
                  <button
                    id="wishPrivacyToggle"
                    type="button"
                    class="wish-privacy-toggle"
                  >
                    비밀소원
                  </button>
            <button id="wishSubmitBtn" class="wish-btn wish-btn-primary">
              소원 올리기
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 기존 숨겨진 파일 input 그대로 사용 -->
<input
  id="wishFileInput"
  type="file"
  accept="image/*"
  style="display:none"
/>

    <!-- 앱 엔트리포인트 -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
